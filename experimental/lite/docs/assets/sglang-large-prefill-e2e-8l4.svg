   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #172a3a" transform="translate(62.496 347.073914)">First four cases: 2 sessions × 3 calls/backend, KV fraction 0.87. Last case: 1 session × 3 calls/backend, KV fraction 0.90.</text>
   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #172a3a" transform="translate(62.496 359.143281)">The same fixed server profile is used for both backends within each study; no per-size best-variant selection.</text>
