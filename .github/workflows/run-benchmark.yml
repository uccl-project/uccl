name: CI Command Dispatcher
on:
  issue_comment:
    types: [created]
  push:
    branches: [codex/ci-cpu-apt-recovery]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
jobs:
  dispatch:
    if: github.event.issue.pull_request && (startsWith(github.event.comment.body, '/run-benchmark') || startsWith(github.event.comment.body, '/run-ci'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted command helper
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize, comment and dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await require('./ci/github_comments.js').dispatch({github, context, core});

  # Temporary live validation for PR #1145; removed after observing both replies.
  comment-smoke:
    if: github.event_name == 'push' && github.repository == 'uccl-project/uccl' && github.ref == 'refs/heads/codex/ci-cpu-apt-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise actual comment and dispatch APIs
        uses: actions/github-script@v7
        with:
          script: |
            const {dispatch} = require('./ci/github_comments.js');
            for (const command of ['/run-benchmark cpu ci.selftest']) {
              const request = {
                ...context,
                repo: context.repo,
                payload: {
                  repository: {default_branch: context.ref.replace('refs/heads/', '')},
                  issue: {number: 1145, pull_request: {}},
                  comment: {
                    body: command,
                    user: {login: context.actor},
                    html_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  },
                },
              };
              await dispatch({github, context: request, core});
            }

  matrix-name-smoke:
    name: GPU queue check
    if: github.event_name == 'push' && github.repository == 'uccl-project/uccl' && github.ref == 'refs/heads/codex/ci-cpu-apt-recovery'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        target: [l4, gb10, gh200]
    concurrency:
      group: uccl-queue-smoke-${{ github.run_id }}
      queue: max
      cancel-in-progress: false
    steps:
      - run: |
          echo 'Checking the GitHub queue with three jobs and no lab access'
          sleep 20
