name: P2P Host Tests

on:
  push:
    branches: [main]
    paths:
      - 'p2p/**'
      - '.github/workflows/p2p-host-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'p2p/**'
      - '.github/workflows/p2p-host-tests.yml'

permissions:
  contents: read

jobs:
  proxy-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test production scheduler and proxy adapter with CPU transport doubles
        run: make -C p2p/tests test
      - name: Check address and undefined-behavior sanitizers
        run: make -C p2p/tests sanitize
