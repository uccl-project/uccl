name: Clang Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clang-format-check:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pre-commit
      run: python -m pip install -r scripts/requirements-format.txt
    - name: Check C++ and CUDA formatting
      run: pre-commit run clang-format --all-files --show-diff-on-failure

  python-format-check:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pre-commit
      run: python -m pip install -r scripts/requirements-format.txt
    - name: Check Python formatting
      run: pre-commit run black --all-files --show-diff-on-failure
