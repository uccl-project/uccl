name: UCCL CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target IDs, comma separated (empty = all enabled)'
        default: ''
      tests:
        description: 'Test IDs/globs, comma separated (empty = all affected)'
        default: ''
      exclude:
        description: 'Test IDs/globs to exclude'
        default: ''
      tiers:
        description: 'cpu,build,integration,performance'
        default: 'cpu,build,integration'
      sha:
        description: 'Exact source SHA (maintainer-approved PR testing)'
        default: ''
      head_repo:
        description: 'Source owner/repo (empty = this repository)'
        default: ''
      pr:
        description: 'PR number for command status comments (set by dispatcher)'
        default: ''
      reply_comment_id:
        description: 'Bot comment to update (set by dispatcher)'
        default: ''
      reply_marker:
        description: 'Bot comment request marker (set by dispatcher)'
        default: ''

permissions:
  contents: read

jobs:
  comment-start:
    name: Start command status
    if: github.event_name == 'workflow_dispatch' && inputs.reply_comment_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted comment helper
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Mark command running
        uses: actions/github-script@v7
        with:
          script: |
            await require('./ci/github_comments.js').update({github, context, status: 'running'});

  plan:
    runs-on: ubuntu-24.04
    outputs:
      gpu: ${{ steps.plan.outputs.gpu }}
      has_gpu: ${{ steps.plan.outputs.has_gpu }}
      has_cpu: ${{ steps.plan.outputs.has_cpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate inventory and determine affected suites
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGETS: ${{ inputs.targets }}
          TESTS: ${{ inputs.tests }}
          EXCLUDE: ${{ inputs.exclude }}
          TIERS: ${{ inputs.tiers || 'cpu,build,integration' }}
        run: |
          args=(--full)
          if [[ $EVENT == pull_request ]]; then
            base=$(git merge-base "$BASE" "$HEAD") || base=""
            args=(--base "$base" --head "$HEAD")
          elif [[ $EVENT == push ]]; then
            args=(--base "$BASE")
          fi
          python3 ci/catalog.py plan "${args[@]}" --targets "$TARGETS" \
            --tests "$TESTS" --exclude "$EXCLUDE" --tiers "$TIERS" --output ci-plan.json
          python3 ci/report.py plan ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json

  cpu:
    name: CPU
    needs: plan
    if: needs.plan.outputs.has_cpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - name: Install CPU compiler and Python venv support
        timeout-minutes: 8
        run: |
          set -o pipefail
          mkdir -p ci-results
          bash ci/setup_cpu.sh 2>&1 | tee ci-results/cpu-setup.log
      - name: Run CPU suites
        run: python3 ci/run.py --local --target cpu --plan ci-plan.json
      - name: Summarize results
        if: always()
        run: |
          set -o pipefail
          python3 ci/report.py results ci-results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show test logs
        if: always()
        run: python3 ci/report.py logs ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-cpu
          path: ci-results/
          if-no-files-found: error

  gpu:
    name: GPU
    needs: plan
    # PR code reaches lab machines only through a maintainer's workflow dispatch.
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_gpu == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gpu) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: uccl-gpu-${{ matrix.target }}
      # Preserve waiting merge/manual runs instead of replacing the pending job.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - name: Configure dedicated CI credentials
        env:
          CI_KEY: ${{ secrets.UCCL_CI_SSH_KEY }}
          CI_CONFIG: ${{ secrets.UCCL_CI_SSH_CONFIG }}
          CI_KNOWN_HOSTS: ${{ secrets.UCCL_CI_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          test -n "$CI_KEY" && test -n "$CI_CONFIG" && test -n "$CI_KNOWN_HOSTS"
          printf '%s\n' "$CI_KEY" > ~/.ssh/uccl-ci
          printf '%s\n' "$CI_CONFIG" > ~/.ssh/config
          printf '%s\n' "$CI_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run selected GPU suites
        env:
          TARGET: ${{ matrix.target }}
        run: python3 ci/run.py --target "$TARGET" --plan ci-plan.json --ssh-config ~/.ssh/config --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Check performance measurements
        if: always()
        run: python3 ci/performance.py ci-results --candidate ci-results/baseline-candidate.json
      - name: Summarize results
        if: always()
        run: |
          set -o pipefail
          python3 ci/report.py results ci-results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show test logs
        if: always()
        run: python3 ci/report.py logs ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gpu-${{ matrix.target }}
          path: ci-results/
          if-no-files-found: error
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/uccl-ci ~/.ssh/config

  status:
    name: CI status
    needs: [plan, cpu, gpu]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report aggregate CI status
        env:
          PLAN: ${{ needs.plan.result }}
          CPU_RESULT: ${{ needs.cpu.result }}
          GPU_RESULT: ${{ needs.gpu.result }}
        run: |
          printf '| Job | Result |\n|---|---|\n| Plan | %s |\n| CPU | %s |\n| GPU | %s |\n' \
            "$PLAN" "$CPU_RESULT" "$GPU_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $PLAN != success ]]; then
            echo "::error::CI planning did not succeed: $PLAN"
            exit 1
          fi
          failed=0
          for entry in "CPU:$CPU_RESULT" "GPU:$GPU_RESULT"; do
            case ${entry#*:} in
              success|skipped) ;;
              cancelled)
                echo "::error::${entry%%:*} jobs were cancelled before completion; check their scheduling/cancellation annotations."
                failed=1 ;;
              *)
                echo "::error::${entry%%:*} jobs did not succeed: ${entry#*:}"
                failed=1 ;;
            esac
          done
          exit "$failed"

  comment-result:
    name: Finish command status
    needs: [comment-start, plan, cpu, gpu, status]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.reply_comment_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted comment helper
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Post command result
        uses: actions/github-script@v7
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.CI_JOB_RESULTS);
            await require('./ci/github_comments.js').update({github, context, status: 'complete', results});
