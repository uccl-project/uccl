name: EP Host Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  runtime-gpu-topology-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test runtime GPU ordinals without GPU hardware
      run: |
        g++ -std=c++17 -O2 include/util/gpu_topology_test.cc -o "$RUNNER_TEMP/uccl-gpu-topology-test"
        "$RUNNER_TEMP/uccl-gpu-topology-test"

  rdma-addressing-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install RDMA headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libibverbs-dev

    - name: Test RDMA address-vector construction
      run: make -C ep/tests test HOST_TEST_INCLUDES=-I../include
