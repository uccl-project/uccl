name: GIN CUDA build
on:
  push:
    branches: [gin-native-sm120-main, gin-cooperative-ht-fix-main]
  pull_request:
    paths:
      - 'experimental/uccl_gin/**'
      - 'thirdparty/nccl-ep/**'
      - '.github/workflows/gin-cuda-build.yml'
permissions:
  contents: read
jobs:
  cuda-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda@sha256:7d56ebe2b7cd864a60dca3c8b2d0a39f8fc110417e8253e32505c3387f59119c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake \
            python3-dev python3-pip libnuma-dev libibverbs-dev ibverbs-providers \
            libnl-3-dev libnl-route-3-dev libopenmpi-dev
          python3 -m pip install --no-cache-dir --target /tmp/gin-nccl nvidia-nccl-cu13==2.30.4
      - name: Build standalone host transport and SM120 device API
        run: |
          /usr/local/cuda/bin/nvcc --version
          make -C experimental/uccl_gin -j2 SM=120 CUDA_HOME=/usr/local/cuda \
            NCCL_INC=/tmp/gin-nccl/nvidia/nccl/include \
            NCCL_LIB=/tmp/gin-nccl/nvidia/nccl/lib EFA_HOME=/usr \
            MPI_PREFIX=/usr/lib/x86_64-linux-gnu/openmpi
          make -C experimental/uccl_gin/tests/local -j2 SM=120
          make -C experimental/uccl_gin/tests/local -j2 SM=90
      - name: Build optional NCCL-EP adapter and contract fixtures
        run: |
          if test -f thirdparty/nccl-ep/CMakeLists.txt; then
            make -C experimental/uccl_gin/tests/local -j2 SM=120 \
              NCCL_INCLUDE_DIR=/tmp/gin-nccl/nvidia/nccl/include \
              EXTRA_DEVFLAGS=-DNCCL_GIN_GDAKI_ENABLE=0 \
              coop-tests compile-fail adapter-tests adapter-compile-fail ht-tests model-tests perf-controls
            for gin_backend in OFF ON; do
              cmake -S thirdparty/nccl-ep -B /tmp/ep-$gin_backend \
                -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
                -DCMAKE_CUDA_ARCHITECTURES=120 \
                -DNCCL_DIR=/tmp/gin-nccl/nvidia/nccl \
                -DNCCL_EP_USE_UCCL_GIN=$gin_backend \
                -D_NCCL_EP_LSA_TEAM_SIZE_MIN=1 -D_NCCL_EP_LSA_TEAM_SIZE_MAX=1 \
                '-D_NCCL_EP_NUM_LSA_TEAMS_LIST=1;2'
              cmake --build /tmp/ep-$gin_backend --target nccl_ep_shared -j2
            done
          fi
